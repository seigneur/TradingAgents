name: Daily Trading Signal

on:
  schedule:
    - cron: '0 1,13 * * *'  # 09:00 and 21:00 SGT (UTC+8)
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Space-separated tickers (e.g. BTC-USD ETH-USD)'
        default: 'BTC-USD ETH-USD XRP-USD LINK-USD GLD'
      date:
        description: 'Analysis date YYYY-MM-DD (default: yesterday)'
        default: ''

permissions:
  contents: read
  id-token: write  # OIDC login to AWS (no stored AWS keys)

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Saves the latest prediction per ticker to DynamoDB for the hourly watcher.
      # Skipped until the repo variable AWS_ROLE_ARN is set (see infra/aws/README.md).
      - name: AWS credentials
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e . boto3

      - name: Run daily signal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_KEY }}
          TRADINGAGENTS_LLM_PROVIDER: anthropic
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_SECRET: ${{ secrets.DASHBOARD_SECRET }}
          SIGNALS_TABLE: ${{ vars.AWS_ROLE_ARN != '' && 'tradingagents-signals' || '' }}
        run: |
          TICKERS="${{ github.event.inputs.tickers || 'BTC-USD ETH-USD XRP-USD LINK-USD GLD' }}"
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -n "$DATE_ARG" ]; then
            python scripts/daily_signal.py --tickers $TICKERS --date "$DATE_ARG"
          else
            python scripts/daily_signal.py --tickers $TICKERS
          fi
