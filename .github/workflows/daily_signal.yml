name: Daily Trading Signal

on:
  schedule:
    # 00:30 UTC = 08:30 SGT — markets have opened, overnight macro digested
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Space-separated tickers (e.g. BTC-USD ETH-USD)'
        default: 'BTC-USD ETH-USD XRP-USD LINK-USD GC=F'
      date:
        description: 'Analysis date YYYY-MM-DD (default: yesterday)'
        default: ''

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Run daily signal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_KEY }}
          TRADINGAGENTS_LLM_PROVIDER: anthropic
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_SECRET: ${{ secrets.DASHBOARD_SECRET }}
        run: |
          TICKERS="${{ github.event.inputs.tickers || 'BTC-USD ETH-USD XRP-USD LINK-USD GC=F' }}"
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -n "$DATE_ARG" ]; then
            python scripts/daily_signal.py --tickers $TICKERS --date "$DATE_ARG"
          else
            python scripts/daily_signal.py --tickers $TICKERS
          fi
